[package]
name = "bt-roam-player"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bluer = { version = "0.17.4", features = ["bluetoothd"] }
clap = { version = "4.6.7", features = ["derive"] }
dbus = "0.9"
dbus-tokio = "0.7"
futures = "0.3.34"
libc = "0.2.190"
libspa-sys = "0.10"
pipewire = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
symphonia = { version = "0.6.1", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util"] }
